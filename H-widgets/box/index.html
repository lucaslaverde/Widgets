<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="transparent" />
    <title>Hondubet · Caja misteriosa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --hb-dark: #041d3d;
        --hb-dark-deep: #020914;
        --hb-blue: #00a4ff;
        --hb-blue-dark: #0040a0;
        --hb-cyan: #00b7e3;
        --hb-cyan-light: #72efff;

        --hb-green: #2cda20;
        --hb-green-2: #21d66b;
        --hb-green-dark: #07943f;
        --hb-green-light: #86ffae;

        --hb-white: #ffffff;
        --hb-soft: #d9ecff;
        --hb-muted: #9fb6d8;

        --cube-size: 230px;
        --cube-half: 115px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        background: transparent !important;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        color: var(--hb-white);
        background: transparent !important;
        font-family: "Outfit", Arial, sans-serif;
      }

      button {
        font: inherit;
      }

      .hb-widget {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        background: transparent !important;
      }

      .hb-shell {
        position: relative;
        width: 100%;
        min-height: 610px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 26px 22px 30px;

        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        overflow: hidden;
      }

      .hb-heading {
        position: relative;
        z-index: 20;
        width: 100%;
        max-width: 460px;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;

        margin-bottom: 12px;
        text-align: center;
      }

      .hb-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;

        min-height: 28px;
        padding: 7px 14px;

        border: 1px solid rgba(114, 239, 255, 0.32);
        border-radius: 999px;

        background:
          linear-gradient(180deg,
            rgba(0, 183, 227, 0.24),
            rgba(0, 64, 160, 0.18));

        color: var(--hb-cyan-light);

        font-size: 10px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 1.4px;
        text-transform: uppercase;

        box-shadow:
          0 0 18px rgba(0, 183, 227, 0.15),
          inset 0 1px 0 rgba(255, 255, 255, 0.10);

        animation: badgePulse 1.6s ease-in-out infinite;
      }

      .hb-badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--hb-green);
        box-shadow: 0 0 9px rgba(44, 218, 32, 0.85);
      }

      @keyframes badgePulse {

        0%,
        100% {
          transform: scale(1);
          filter: brightness(1);
        }

        50% {
          transform: scale(1.035);
          filter: brightness(1.14);
        }
      }

      .hb-title {
        max-width: 450px;
        color: var(--hb-white);
        font-family: "Oswald", "Outfit", sans-serif;
        font-size: clamp(32px, 7vw, 48px);
        line-height: 0.98;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        text-shadow:
          0 3px 16px rgba(0, 0, 0, 0.72),
          0 0 22px rgba(0, 183, 227, 0.48);
      }

      .hb-subtitle {
        max-width: 390px;
        color: var(--hb-soft);
        font-size: 15px;
        line-height: 1.4;
        font-weight: 600;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.80);
      }

      .cube-stage {
        position: relative;
        z-index: 10;

        width: 100%;
        height: 330px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-bottom: 12px;

        perspective: 1150px;
        -webkit-perspective: 1150px;

        transition:
          height 0.45s ease,
          opacity 0.45s ease,
          transform 0.45s ease;
      }

      .cube-stage::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;

        width: 330px;
        height: 330px;
        border-radius: 50%;

        background:
          radial-gradient(circle,
            rgba(255, 255, 255, 0.32) 0%,
            rgba(0, 183, 227, 0.18) 28%,
            rgba(33, 214, 107, 0.09) 49%,
            transparent 72%);

        filter: blur(16px);
        transform: translate(-50%, -50%);
        animation: auraPulse 2.3s ease-in-out infinite;
        pointer-events: none;
      }

      .cube-stage::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 24px;

        width: 220px;
        height: 42px;
        border-radius: 50%;

        background:
          radial-gradient(ellipse,
            rgba(0, 0, 0, 0.60),
            rgba(0, 0, 0, 0.22) 50%,
            transparent 72%);

        filter: blur(8px);
        transform: translateX(-50%);
        animation: shadowPulse 2.3s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes auraPulse {

        0%,
        100% {
          opacity: 0.62;
          transform: translate(-50%, -50%) scale(0.92);
        }

        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.07);
        }
      }

      @keyframes shadowPulse {

        0%,
        100% {
          opacity: 0.60;
          transform: translateX(-50%) scaleX(0.86);
        }

        50% {
          opacity: 0.92;
          transform: translateX(-50%) scaleX(1);
        }
      }

      .cube-wrapper {
        position: relative;
        z-index: 5;

        width: var(--cube-size);
        height: var(--cube-size);

        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;

        animation: cubeFloat 1.9s ease-in-out infinite alternate;
      }

      @keyframes cubeFloat {
        from {
          transform: translateY(8px);
        }

        to {
          transform: translateY(-9px);
        }
      }

      .cube {
        position: absolute;
        inset: 0;

        width: var(--cube-size);
        height: var(--cube-size);

        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;

        animation: cubeSpin 7s linear infinite;
        will-change: transform;
      }

      @keyframes cubeSpin {
        from {
          transform: rotateX(-14deg) rotateY(0deg);
        }

        to {
          transform: rotateX(-14deg) rotateY(360deg);
        }
      }

      .cube-side {
        position: absolute;
        inset: 0;

        width: var(--cube-size);
        height: var(--cube-size);

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;

        border: 2px solid rgba(114, 239, 255, 0.72);
        border-radius: 20px;

        background:
          linear-gradient(145deg,
            rgba(0, 183, 227, 0.92),
            rgba(0, 64, 160, 0.92) 56%,
            rgba(4, 29, 61, 0.98));

        box-shadow:
          inset 0 0 42px rgba(0, 0, 0, 0.30),
          inset 0 1px 0 rgba(255, 255, 255, 0.34),
          0 0 24px rgba(0, 183, 227, 0.24);

        backface-visibility: visible;
        -webkit-backface-visibility: visible;
      }

      .cube-side::before {
        content: "";
        position: absolute;
        inset: 9px;

        border: 1px solid rgba(255, 255, 255, 0.20);
        border-radius: 13px;

        background:
          linear-gradient(135deg,
            rgba(255, 255, 255, 0.15),
            transparent 35%,
            rgba(33, 214, 107, 0.10) 72%,
            transparent);
      }

      .cube-side::after {
        content: "";
        position: absolute;
        inset: 0;

        background:
          repeating-linear-gradient(45deg,
            rgba(255, 255, 255, 0.035) 0,
            rgba(255, 255, 255, 0.035) 10px,
            transparent 10px,
            transparent 22px);

        opacity: 0.48;
      }

      .front {
        transform: translateZ(var(--cube-half));
      }

      .back {
        transform: rotateY(180deg) translateZ(var(--cube-half));
      }

      .right {
        transform: rotateY(90deg) translateZ(var(--cube-half));
        background:
          linear-gradient(145deg,
            rgba(0, 183, 227, 0.94),
            rgba(0, 111, 202, 0.95) 52%,
            rgba(0, 64, 160, 0.98));
      }

      .left {
        transform: rotateY(-90deg) translateZ(var(--cube-half));
        background:
          linear-gradient(145deg,
            rgba(0, 140, 255, 0.94),
            rgba(0, 64, 160, 0.95) 58%,
            rgba(3, 25, 58, 0.98));
      }

      .top {
        transform: rotateX(90deg) translateZ(var(--cube-half));
        background:
          linear-gradient(145deg,
            rgba(185, 248, 255, 0.98),
            rgba(114, 239, 255, 0.96) 24%,
            rgba(0, 183, 227, 0.95) 58%,
            rgba(0, 64, 160, 0.98));
      }

      .bottom {
        transform: rotateX(-90deg) translateZ(var(--cube-half));
        background:
          linear-gradient(145deg,
            rgba(0, 164, 255, 0.96),
            rgba(0, 111, 202, 0.95) 48%,
            rgba(4, 29, 61, 0.98));
      }

      .cube-mark {
        position: relative;
        z-index: 5;

        display: flex;
        align-items: center;
        justify-content: center;

        width: 120px;
        height: 150px;

        color: var(--hb-white);

        font-family: "Oswald", sans-serif;
        font-size: 132px;
        line-height: 1;
        font-weight: 700;

        text-shadow:
          0 6px 0 rgba(0, 64, 160, 0.82),
          0 10px 18px rgba(0, 0, 0, 0.42),
          0 0 24px rgba(255, 255, 255, 0.74),
          0 0 34px rgba(114, 239, 255, 0.78);

        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.42));
        transform: translateY(-5px);
      }

      .burst-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 25;

        width: 40px;
        height: 40px;

        border-radius: 50%;

        opacity: 0;
        pointer-events: none;

        transform: translate(-50%, -50%) scale(0.1);

        background:
          radial-gradient(circle,
            rgba(255, 255, 255, 1) 0%,
            rgba(220, 250, 255, 0.98) 12%,
            rgba(114, 239, 255, 0.95) 28%,
            rgba(0, 183, 227, 0.76) 46%,
            rgba(0, 164, 255, 0.34) 62%,
            transparent 76%);

        box-shadow:
          0 0 26px rgba(255, 255, 255, 0.95),
          0 0 54px rgba(114, 239, 255, 0.90),
          0 0 90px rgba(0, 183, 227, 0.72);
      }

      .burst-glow::before,
      .burst-glow::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;

        width: 300px;
        height: 12px;

        border-radius: 999px;

        background:
          linear-gradient(90deg,
            transparent,
            rgba(255, 255, 255, 0.95),
            rgba(114, 239, 255, 0.85),
            transparent);

        transform: translate(-50%, -50%);
        filter: blur(1px);
      }

      .burst-glow::after {
        transform: translate(-50%, -50%) rotate(90deg);
      }

      .cube-stage.is-opening .cube-wrapper {
        animation: openingShake 0.95s ease-in-out both;
      }

      .cube-stage.is-opening .cube {
        animation-play-state: paused;
      }

      .cube-stage.is-bursting .cube-wrapper {
        animation: cubeDisappear 0.42s ease-out forwards;
      }

      .cube-stage.is-bursting .burst-glow {
        animation: burstExplosion 0.58s ease-out forwards;
      }

      @keyframes openingShake {
        0% {
          transform: translate(0, 0) rotate(0deg) scale(1);
        }

        10% {
          transform: translate(-6px, 1px) rotate(-2deg) scale(1.01);
        }

        20% {
          transform: translate(7px, -2px) rotate(3deg) scale(1.02);
        }

        30% {
          transform: translate(-9px, 2px) rotate(-4deg) scale(1.03);
        }

        40% {
          transform: translate(10px, -2px) rotate(4deg) scale(1.04);
        }

        50% {
          transform: translate(-11px, 2px) rotate(-5deg) scale(1.05);
        }

        60% {
          transform: translate(11px, -2px) rotate(5deg) scale(1.05);
        }

        70% {
          transform: translate(-8px, 1px) rotate(-3deg) scale(1.04);
        }

        80% {
          transform: translate(7px, -1px) rotate(3deg) scale(1.03);
        }

        90% {
          transform: translate(-4px, 0) rotate(-1deg) scale(1.02);
        }

        100% {
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
      }

      @keyframes cubeDisappear {
        0% {
          opacity: 1;
          transform: scale(1);
          filter: brightness(1);
        }

        45% {
          opacity: 1;
          transform: scale(1.08);
          filter:
            brightness(1.8) drop-shadow(0 0 28px rgba(114, 239, 255, 0.95));
        }

        100% {
          opacity: 0;
          transform: scale(0.72);
          filter:
            brightness(2.4) blur(5px);
        }
      }

      @keyframes burstExplosion {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.08);
          filter: blur(0);
        }

        18% {
          opacity: 1;
        }

        52% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(5.4);
          filter: blur(0.5px);
        }

        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(7.2);
          filter: blur(5px);
        }
      }

      .cube-stage.is-hidden {
        height: 0;
        margin: 0;
        opacity: 0;
        transform: scale(0.82);
        pointer-events: none;
      }

      .result-window {
        position: relative;
        z-index: 30;

        width: 100%;
        max-width: 430px;

        display: none;
        flex-direction: column;
        align-items: center;

        margin: 4px auto 24px;
        padding: 28px 22px 24px;

        overflow: hidden;

        border: 1px solid rgba(114, 239, 255, 0.32);
        border-radius: 24px;

        background:
          radial-gradient(circle at 50% 0%,
            rgba(0, 183, 227, 0.23),
            transparent 48%),
          linear-gradient(145deg,
            rgba(13, 35, 70, 0.97),
            rgba(3, 12, 27, 0.98));

        box-shadow:
          0 22px 44px rgba(0, 0, 0, 0.44),
          0 0 28px rgba(0, 183, 227, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.09);
      }

      .result-window.is-visible {
        display: flex;
        animation:
          resultAppear 0.72s cubic-bezier(0.2, 0.9, 0.28, 1.15) both;
      }

      @keyframes resultAppear {
        0% {
          opacity: 0;
          transform: translateY(18px) scale(0.72);
          filter: blur(7px);
        }

        72% {
          opacity: 1;
          transform: translateY(-3px) scale(1.04);
          filter: blur(0);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .result-window::before {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(44, 218, 32, 0.30);
        border-radius: 17px;
        pointer-events: none;
      }

      .result-window::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;

        width: 72%;
        height: 2px;

        background:
          linear-gradient(90deg,
            transparent,
            var(--hb-cyan-light),
            var(--hb-green),
            transparent);

        box-shadow: 0 0 16px rgba(0, 183, 227, 0.70);
        transform: translateX(-50%);
      }

      .result-icon {
        position: relative;
        z-index: 2;

        width: 58px;
        height: 58px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-bottom: 12px;

        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;

        background:
          linear-gradient(145deg,
            var(--hb-green-light),
            var(--hb-green) 48%,
            var(--hb-green-dark));

        color: #031309;
        font-size: 30px;
        font-weight: 900;

        box-shadow:
          0 0 24px rgba(44, 218, 32, 0.40),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }

      .result-kicker {
        position: relative;
        z-index: 2;

        margin-bottom: 6px;
        color: var(--hb-cyan-light);

        font-size: 11px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 1.6px;
        text-align: center;
        text-transform: uppercase;
      }

      .result-prize {
        position: relative;
        z-index: 2;

        width: 100%;
        margin-bottom: 8px;

        color: transparent;

        background:
          linear-gradient(180deg,
            #ffffff 0%,
            #dffaff 20%,
            #72efff 43%,
            #00b7e3 67%,
            #2cda20 100%);

        -webkit-background-clip: text;
        background-clip: text;

        font-family: "Oswald", sans-serif;
        font-size: clamp(48px, 12vw, 78px);
        line-height: 0.95;
        font-weight: 700;
        letter-spacing: -2px;
        text-align: center;
        text-transform: uppercase;

        filter:
          drop-shadow(0 4px 0 rgba(0, 64, 160, 0.76)) drop-shadow(0 0 18px rgba(0, 183, 227, 0.48));
      }

      .result-prize span {
        display: block;
        margin-top: 8px;
        font-family: "Outfit", sans-serif;
        font-size: clamp(21px, 6vw, 34px);
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
      }

      .result-copy {
        position: relative;
        z-index: 2;

        max-width: 340px;

        color: var(--hb-soft);
        font-size: 16px;
        line-height: 1.4;
        font-weight: 600;
        text-align: center;
      }

      .hb-button {
        position: relative;
        z-index: 40;

        width: 100%;
        max-width: 340px;
        min-height: 58px;

        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        padding: 17px 24px;

        overflow: hidden;

        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 16px;

        background:
          linear-gradient(180deg,
            var(--hb-green-light) 0%,
            var(--hb-green) 48%,
            var(--hb-green-dark) 100%);

        color: var(--hb-white);

        font-size: 16px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 1px;
        text-align: center;
        text-transform: uppercase;

        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.40);

        box-shadow:
          0 0 24px rgba(44, 218, 32, 0.34),
          0 14px 28px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.46);

        cursor: pointer;

        transition:
          transform 0.18s ease,
          filter 0.18s ease,
          box-shadow 0.18s ease;
      }

      .hb-button::before {
        content: "";
        position: absolute;
        top: -20%;
        bottom: -20%;
        left: -90px;

        width: 52px;

        background: rgba(255, 255, 255, 0.45);
        filter: blur(2px);
        transform: skewX(-22deg);

        animation: buttonShine 3.4s ease-in-out infinite;
      }

      @keyframes buttonShine {

        0%,
        60% {
          left: -90px;
        }

        82%,
        100% {
          left: calc(100% + 90px);
        }
      }

      .hb-button:hover {
        transform: translateY(-2px) scale(1.02);
        filter: brightness(1.08);

        box-shadow:
          0 0 30px rgba(44, 218, 32, 0.46),
          0 17px 30px rgba(0, 0, 0, 0.40),
          inset 0 1px 0 rgba(255, 255, 255, 0.48);
      }

      .hb-button:active {
        transform: scale(0.98);
      }

      .hb-button.is-claim {
        background:
          linear-gradient(180deg,
            #86ffae,
            var(--hb-green) 48%,
            var(--hb-green-dark));
      }

      .hb-button.is-close {
        background:
          linear-gradient(180deg,
            var(--hb-cyan),
            var(--hb-blue) 48%,
            var(--hb-blue-dark));

        box-shadow:
          0 0 26px rgba(0, 183, 227, 0.36),
          0 14px 28px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.30);
      }

      .hb-button:disabled {
        opacity: 0.68;
        cursor: not-allowed;
        transform: none;
      }

      @media screen and (max-width: 520px) {
        :root {
          --cube-size: 190px;
          --cube-half: 95px;
        }

        .hb-widget {
          width: 360px;
          max-width: 96vw;
        }

        .hb-shell {
          min-height: 570px;
          padding: 22px 14px 24px;
        }

        .hb-heading {
          gap: 7px;
          margin-bottom: 10px;
        }

        .hb-title {
          max-width: 330px;
          font-size: 31px;
        }

        .hb-subtitle {
          max-width: 310px;
          font-size: 13px;
        }

        .cube-stage {
          height: 290px;
          margin-bottom: 8px;
        }

        .cube-stage::before {
          width: 290px;
          height: 290px;
        }

        .cube-stage::after {
          width: 190px;
          bottom: 24px;
        }

        .cube-mark {
          width: 100px;
          height: 120px;
          font-size: 106px;
        }

        .result-window {
          max-width: 330px;
          padding: 24px 17px 21px;
          margin-bottom: 19px;
        }

        .result-icon {
          width: 50px;
          height: 50px;
          font-size: 26px;
        }

        .result-prize {
          font-size: clamp(46px, 16vw, 66px);
        }

        .result-copy {
          font-size: 14px;
        }

        .hb-button {
          max-width: 320px;
          min-height: 53px;
          padding: 15px 18px;
          font-size: 14px;
        }
      }

      @media screen and (max-width: 370px) {
        :root {
          --cube-size: 170px;
